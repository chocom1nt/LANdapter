version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-landapter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: landapter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The official Postgres image runs these on first initialization only.
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_add_mac.up.sql:/docker-entrypoint-initdb.d/002_add_mac.sql:ro
      - ./migrations/003_add_devices.up.sql:/docker-entrypoint-initdb.d/003_add_devices.sql:ro
      - ./migrations/004_add_snapshots.up.sql:/docker-entrypoint-initdb.d/004_add_snapshots.sql:ro
      - ./migrations/005_agent_credentials.up.sql:/docker-entrypoint-initdb.d/005_agent_credentials.sql:ro
      - ./migrations/006_fix_clients_schema.up.sql:/docker-entrypoint-initdb.d/006_fix_clients_schema.sql:ro
      - ./migrations/007_policies_schedules.up.sql:/docker-entrypoint-initdb.d/007_policies_schedules.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  master:
    build:
      context: .
      dockerfile: Dockerfile
    command: ./bin/master
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-landapter}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LANDAPTER_ADMIN_TOKEN: ${LANDAPTER_ADMIN_TOKEN:?Set LANDAPTER_ADMIN_TOKEN to a different random secret of at least 32 characters}
    volumes:
      - ./configs/master.yaml:/app/configs/master.yaml:ro
      - ./uploads:/app/uploads

volumes:
  postgres_data: