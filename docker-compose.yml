version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: landapter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  master:
    build: .
    command: ./bin/master
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
    volumes:
      - ./configs:/app/configs
      - ./bin:/app/bin

volumes:
  postgres_data: